name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        run: |
          mkdir out
          probe(){ n=$1; u=$2; echo "== $n $u" >> out/report.txt
            curl -sS -m 25 -L -H "Origin: https://mmllpp772.github.io" -H "Accept-Encoding: gzip" --compressed -D out/h_$n.txt -o out/b_$n.txt "$u" -w "code=%{http_code} size=%{size_download}\n" >> out/report.txt 2>&1 || echo "curl failed $?" >> out/report.txt
            grep -i -E "^(access-control-allow-origin|content-type|x-ratelimit)" out/h_$n.txt >> out/report.txt || true
            head -c 3000 out/b_$n.txt >> out/report.txt; echo >> out/report.txt; echo >> out/report.txt; }
          probe gdacs_full "https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH?eventlist=TC&fromDate=2026-10-13&toDate=2026-10-24"
          probe gdacs_geom "https://www.gdacs.org/gdacsapi/api/polygons/getgeometry?eventtype=TC&eventid=1001338&episodeid=35"
          probe gdacs_ev "https://www.gdacs.org/gdacsapi/api/events/geteventdata?eventtype=TC&eventid=1001338"
          probe jma_spec "https://www.jma.go.jp/bosai/typhoon/data/TC2636/specifications.json"
          probe jma_fc "https://www.jma.go.jp/bosai/typhoon/data/TC2636/forecast.json"
          probe dt_vessels "https://meri.digitraffic.fi/api/ais/v1/vessels"
          probe usgs_week "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_week.geojson"
          probe raw "https://raw.githubusercontent.com/mmllpp772/wildcams/main/README.md"
          ls -la out >> out/report.txt
      - name: Save report to probe branch
        run: |
          cd out && rm -f b_*.txt
          git init -q && git checkout -q -b probe && git add report.txt h_*.txt
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm "probe report"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
